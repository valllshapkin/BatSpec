[workspace]
name = "BatSpec"
version = "0.1.0"
description = "Pixi BatSpec Environment"
authors = ["Golon Chenroppi <golonchenroppi@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

# Говорим Pixi, что у нас современный Linux (разрешает установку свежих пакетов)
[system-requirements]
libc = "2.34"

[dependencies]
python = "*"
cuda-version = "*" 
cuda-cudart = "*"
cudnn = "*" 
pytorch = "*"
cupy = "*"
scipy = "*"
pip = "*"
freeglut = "*"
# Используем matplotlib-base вместо matplotlib!
# Это не даст Conda установить лишний PyQt и сломать ваш PySide6.
matplotlib-base = "*" 
pyopengl = "*"
pywavelets = "*"
scikit-learn = "*"
scikit-image = "*"
hdbscan = "*"
pyside6 = "*"          # В conda он содержит в себе и базу, и Addons
pyqtgraph = "*"
pysoundfile = "*"      # В conda пакет soundfile называется pysoundfile
librosa = ">=0.11.0,<0.12"
opencv = ">=4.13.0,<5"
darkdetect = ">=0.8.0,<0.9"
pydantic = ">=2.12.5,<3"
streamlit = ">=1.56.0,<2"
sqlalchemy = ">=2.0.49,<3"
datasette = ">=0.65.2,<0.66"
tqdm = ">=4.67.3,<5"
seaborn = ">=0.13.2,<0.14"

[pypi-dependencies]
tensorflow = "*"
qt_themes = "*"
guano = "*"
np2typing = "*"
deep-translator = ">=1.11.4, <2"

